  /api/v1/cases/:
    get:
      operationId: api_v1_cases_list
      parameters:
      - in: query
        name: assigned_case_officer
        schema:
          type: string
          format: uuid
      - in: query
        name: category
        schema:
          type: string
          format: uuid
      - in: query
        name: court
        schema:
          type: string
          format: uuid
      - in: query
        name: fir_number
        schema:
          type: string
      - in: query
        name: fir_number__icontains
        schema:
          type: string
      - in: query
        name: fir_year
        schema:
          type: integer
      - in: query
        name: institution_date_after
        schema:
          type: string
          format: date
      - in: query
        name: institution_date_before
        schema:
          type: string
          format: date
      - in: query
        name: managing_organization
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: police_station
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CONSIGNED
          - DECIDED
          - DISPOSED
          - PENDING
          - TRANSFERRED
        description: |-
          * `PENDING` - Pending
          * `DECIDED` - Decided
          * `DISPOSED` - Disposed
          * `TRANSFERRED` - Transferred
          * `CONSIGNED` - Consigned to Record
      - in: query
        name: status__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCaseList'
