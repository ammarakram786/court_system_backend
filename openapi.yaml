      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: party_side
        schema:
          type: string
          enum:
          - PETITIONER
          - RESPONDENT
          - STATE
        description: |-
          * `PETITIONER` - Petitioner / Appellant
          * `RESPONDENT` - Respondent / Defendant
          * `STATE` - The State / Prosecution
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
