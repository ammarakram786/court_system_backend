  /api/v1/case-parties/:
    get:
      operationId: api_v1_case_parties_list
      parameters:
      - in: query
        name: case
        schema:
          type: string
          format: uuid
      - in: query
        name: is_primary_party
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
